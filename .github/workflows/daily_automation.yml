name: Daily Vietnam ESL Pipeline

on:
  schedule:
    # 22:30 UTC = 23:30 Casablanca time (UTC+1)
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run Daily ESL Automation
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          PARENT_FOLDER_ID: "13H4RSyyrwza7oml5OYjlCki3QH8oM_25"
        run: |
          python run_cloud_daily.py

      - name: Commit and push updated job history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history_jobs.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update job history [skip ci]" && git push)
